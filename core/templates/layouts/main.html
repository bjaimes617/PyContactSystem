<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu portal Contable | Dashboard</title>
    <link href="{% static 'css/bulma.min.css' %}" type="text/css"  rel="stylesheet">    
</head>
    <body>
        <section class="hero is-fullheight bulma-text-00-l"> 
            {% include 'partials/sidebar.html' %}
            <div class="hero-body">               
                <div class="container">   
             
                    <div class="column is-12">
                        {% block content %} 
                        {% endblock %}    
                    </div>
                    
                </div>
            </div>
        </section>    
    </body>
</html>
<script src="https://kit.fontawesome.com/5e8155324c.js" crossorigin="anonymous"></script>

<script>    
  document.addEventListener('DOMContentLoaded', () => {
  // Get all "navbar-burger" elements
  const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

  // Add a click event on each of them
  $navbarBurgers.forEach( el => {
    el.addEventListener('click', () => {

      // Get the target from the "data-target" attribute
      const target = el.dataset.target;
      const $target = document.getElementById(target);

      // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
      el.classList.toggle('is-active');
      $target.classList.toggle('is-active');

    });
  });

});</script>
