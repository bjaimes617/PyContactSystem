{% extends 'layouts/login.html' %} 
{% load static %}
{% block content %}
<div class="column is-4 is-offset-4">  
   
    <div class="box">
         <h3 class="title has-text-black">Inicio de Sesion</h3> 
    <hr class="login-hr"/>
    <p class="subtitle has-text-grey-dark">Tu herramienta Contable de confianza.</p>
        <figure class="avatar">
            <img src="{% static '/image/image_3599f037.WebP' %}" />
        </figure>
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}            
            {% if messages %}
                {% for message in messages %}                
                    <div class="notification is-danger is-light is-small has-text-left">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <div class="field">
                <div class="control has-icons-left">
                    <input class="input {% if messages %} is-danger {% endif %}" name="username" id="username" type="email" placeholder="Correo Electronico" autofocus="" />
                    <span class="icon is-small is-left">
                        <i class="fas fa-envelope"></i>
                    </span>
                </div>
            </div>

            <div class="field">
                <div class="control  has-icons-left">
                    <input class="input {% if messages %} is-danger {% endif %}" autocomplete="off" name="password" id="password" type="password" placeholder="Contraseña" />
                    <span class="icon is-small is-left">
                        <i class="fas fa-lock"></i>
                    </span>
                </div>  
            </div>            
            <button class="button is-block is-info is-fullwidth">
               Conectar <i class="fa fa-sign-in" aria-hidden="true"></i>
            </button>
        </form>
    </div>
    <!--<p class="has-text-grey">
        <a href="../">Registrarse</a> &nbsp;·&nbsp;
        <a href="../">Olvidaste tu contraseña</a> &nbsp;·&nbsp;
        <a href="../">Necesitas ayuda?</a>
    </p>-->
</div>
{% endblock %}
